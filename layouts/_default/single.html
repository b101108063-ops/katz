{{ define "main" }}
<article class="post-single">
    <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">
        {{ .Content }}
    </div>
</article>

<style>
    .post-content {
        font-size: 1.02rem;
        line-height: 1.7;
        color: #e5e7eb;
        max-width: 800px;
        margin: 0 auto;
    }
    .post-content h1:first-child { display: none !important; }
    .post-content h2 {
        font-size: 1.4rem;
        color: #60a5fa;
        border-left: 4px solid #3a86ff;
        padding-left: 12px;
        margin-top: 2.2rem;
        margin-bottom: 1rem;
        font-weight: 600;
    }
    .post-content h3 {
        font-size: 1.2rem;
        color: #93c5fd;
        margin-top: 1.8rem;
        margin-bottom: 0.8rem;
        font-weight: 600;
    }
    .post-content h4 {
        font-size: 1.05rem;
        color: #e2e8f0;
        margin-top: 1.4rem;
        margin-bottom: 0.6rem;
        font-weight: 600;
    }
    .post-content ul, .post-content ol {
        padding-left: 1.5rem;
        margin-bottom: 1.2rem;
    }
    .post-content li {
        margin-bottom: 0.5rem;
        line-height: 1.6;
    }
    .post-content table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
        width: 100%;
        border-collapse: collapse;
        margin: 1.8rem 0;
        font-size: 0.95rem;
        background-color: #242526;
        border-radius: 8px;
        border: 1px solid #38393a;
    }
    .post-content th, .post-content td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #38393a;
        color: #e5e7eb;
    }
    .post-content th {
        background-color: #2a2b2c;
        color: #3a86ff;
        font-weight: 700;
    }
    .post-content tr:last-child td { border-bottom: none; }
    .post-content tr:hover { background-color: #2a2b2c; }
    .post-content blockquote {
        border-left: 4px solid #3a86ff;
        padding: 12px 16px;
        margin: 1.5rem 0;
        background-color: #242526;
        border-radius: 4px;
    }
    .post-content blockquote p { margin-bottom: 0.5rem; color: #9ca3af; }
    .post-content strong { color: #60a5fa; font-weight: 600; }
    .post-content em { color: #93c5fd; }
    .post-content hr { border: none; border-top: 1px solid #38393a; margin: 2rem 0; }
</style>
{{ end }}
